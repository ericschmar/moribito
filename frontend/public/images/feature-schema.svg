<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="rgb(241, 239, 235)"/>

  <!-- Database schema representation -->
  <!-- Table 1 -->
  <rect x="80" y="60" width="120" height="100" fill="none" stroke="rgb(16, 122, 77)" stroke-width="3" rx="4"/>
  <rect x="80" y="60" width="120" height="30" fill="rgb(16, 122, 77)" opacity="0.8" rx="4"/>
  <text x="140" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="white">ObjectClass</text>
  <!-- Attributes -->
  <line x1="90" y1="105" x2="190" y2="105" stroke="rgb(16, 122, 77)" stroke-width="2" opacity="0.5"/>
  <line x1="90" y1="125" x2="180" y2="125" stroke="rgb(16, 122, 77)" stroke-width="2" opacity="0.5"/>
  <line x1="90" y1="145" x2="170" y2="145" stroke="rgb(16, 122, 77)" stroke-width="2" opacity="0.5"/>

  <!-- Table 2 -->
  <rect x="220" y="90" width="120" height="100" fill="none" stroke="rgb(6, 40, 27)" stroke-width="3" rx="4"/>
  <rect x="220" y="90" width="120" height="30" fill="rgb(6, 40, 27)" opacity="0.8" rx="4"/>
  <text x="280" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="white">Attributes</text>
  <!-- Attributes -->
  <line x1="230" y1="135" x2="330" y2="135" stroke="rgb(6, 40, 27)" stroke-width="2" opacity="0.5"/>
  <line x1="230" y1="155" x2="320" y2="155" stroke="rgb(6, 40, 27)" stroke-width="2" opacity="0.5"/>
  <line x1="230" y1="175" x2="310" y2="175" stroke="rgb(6, 40, 27)" stroke-width="2" opacity="0.5"/>

  <!-- Relationship line -->
  <line x1="200" y1="110" x2="220" y2="120" stroke="rgb(16, 122, 77)" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Label -->
  <text x="200" y="260" text-anchor="middle" font-size="18" font-weight="600" fill="rgb(42, 42, 42)">
    Schema Inspection
  </text>
</svg>
