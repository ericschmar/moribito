<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="rgb(241, 239, 235)"/>

  <!-- LDAP Directory Tree Illustration -->
  <!-- Main circle (root node) -->
  <circle cx="300" cy="80" r="30" fill="rgb(16, 122, 77)" opacity="0.9"/>
  <text x="300" y="87" text-anchor="middle" font-size="16" font-weight="600" fill="white">DC</text>

  <!-- Second level nodes -->
  <line x1="300" y1="110" x2="200" y2="160" stroke="rgb(16, 122, 77)" stroke-width="2" opacity="0.6"/>
  <circle cx="200" cy="180" r="25" fill="rgb(16, 122, 77)" opacity="0.8"/>
  <text x="200" y="186" text-anchor="middle" font-size="14" font-weight="500" fill="white">OU</text>

  <line x1="300" y1="110" x2="400" y2="160" stroke="rgb(16, 122, 77)" stroke-width="2" opacity="0.6"/>
  <circle cx="400" cy="180" r="25" fill="rgb(16, 122, 77)" opacity="0.8"/>
  <text x="400" y="186" text-anchor="middle" font-size="14" font-weight="500" fill="white">OU</text>

  <!-- Third level nodes -->
  <line x1="200" y1="205" x2="150" y2="250" stroke="rgb(16, 122, 77)" stroke-width="2" opacity="0.5"/>
  <circle cx="150" cy="270" r="20" fill="rgb(6, 40, 27)" opacity="0.8"/>
  <text x="150" y="276" text-anchor="middle" font-size="12" font-weight="500" fill="white">CN</text>

  <line x1="200" y1="205" x2="250" y2="250" stroke="rgb(16, 122, 77)" stroke-width="2" opacity="0.5"/>
  <circle cx="250" cy="270" r="20" fill="rgb(6, 40, 27)" opacity="0.8"/>
  <text x="250" y="276" text-anchor="middle" font-size="12" font-weight="500" fill="white">CN</text>

  <line x1="400" y1="205" x2="350" y2="250" stroke="rgb(16, 122, 77)" stroke-width="2" opacity="0.5"/>
  <circle cx="350" cy="270" r="20" fill="rgb(6, 40, 27)" opacity="0.8"/>
  <text x="350" y="276" text-anchor="middle" font-size="12" font-weight="500" fill="white">CN</text>

  <line x1="400" y1="205" x2="450" y2="250" stroke="rgb(16, 122, 77)" stroke-width="2" opacity="0.5"/>
  <circle cx="450" cy="270" r="20" fill="rgb(6, 40, 27)" opacity="0.8"/>
  <text x="450" y="276" text-anchor="middle" font-size="12" font-weight="500" fill="white">CN</text>

  <!-- Title text -->
  <text x="300" y="340" text-anchor="middle" font-size="24" font-weight="600" fill="rgb(42, 42, 42)">
    LDAP Directory Explorer
  </text>
  <text x="300" y="370" text-anchor="middle" font-size="16" font-weight="400" fill="rgb(106, 106, 106)">
    Visualize your directory structure
  </text>
</svg>
