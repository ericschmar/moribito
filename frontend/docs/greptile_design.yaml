    icon-fonts: 0

components:
  topbars:
    - variant: topbar
      count: 1
      description: application toolbar
      styles:
        height: 48px
        position: relative
  navigation-menus:
    - variant: navigation-menu
      count: 1
      description: Horizontal navigation menu with 26 items
      styles:
        display: block
        padding: 0px
  buttons:
    - variant: outline-small
      description: elevated
      count: 8
      styles:
        background: "rgb(6, 40, 27)"
        color: "rgb(255, 255, 255)"
        padding: "8px 16px"
        font-size: 14px
      states:
        hover:
          transitionDuration: "0.15s"
          transitionEasing: "cubic-bezier(0.4, 0, 0.2, 1)"
          hasTransition: "true"
        disabled:
          utilityClasses: "disabled:pointer-events-none,disabled:opacity-50"
    - variant: outline-large
      description: elevated
      count: 4
      styles:
        background: "rgb(16, 122, 77)"
        color: "rgb(255, 255, 255)"
        padding: "8px 16px"
        font-size: 14px
      states:
        hover:
          transitionDuration: "0.15s"
          transitionEasing: "cubic-bezier(0.4, 0, 0.2, 1)"
          hasTransition: "true"
        disabled:
          utilityClasses: "disabled:pointer-events-none,disabled:opacity-50"

  cards:
    - variant: media
      description: compact size
      count: 10
      styles:
        padding: 4px 0px
      states:
        hover:
          hasTransition: "true"
          transition: "all"
    - variant: accent-padded-elevated
      description: elevated
      count: 9
      styles:
        background: "rgb(6, 40, 27)"
        padding: 8px 16px
        box-shadow: "rgba(0, 0, 0, 0)"
      states:
        hover:
          transitionDuration: "0.15s"
          transitionEasing: "cubic-bezier(0.4, 0, 0.2, 1)"
          hasTransition: "true"
    - variant: overlay-padded
      description: large size
      count: 8
      styles:
        background: "rgba(249, 247, 243, 0.5)"
        padding: 32px
      states:
        hover:
          hasTransition: "true"
          transition: "all"

  inputs:
    - type: email
      variant: email
      description: with border, compact size
      count: 3
      styles:
        background: "rgb(241, 239, 235)"
        border: "1px solid rgb(204, 204, 204)"
        padding: 0px 12px
        height: 36px
      states:
        focus:
          utilityClasses: "focus:outline-none,focus:ring-1,focus:ring-border"
        disabled:
          utilityClasses: "disabled:cursor-not-allowed,disabled:opacity-50"

  navigation:
    - variant: primary
      description: filled button with solid background, compact size
      count: 10
      styles:
        color: "rgb(42, 42, 42)"
        font-size: 14px
        font-weight: 400
        padding: 0px 0px 0px 16px
      states:
        hover:
          hasTransition: "true"
          transition: "all"
          utilityClasses: "hover:text-secondary"
    - variant: default
      description: default variant
      count: 6
      styles:
        color: "rgb(255, 255, 255)"
        font-size: 16px
        font-weight: 400
        padding: 16px
      states:
        hover:
          transitionDuration: "0.15s"
          transitionEasing: "cubic-bezier(0.4, 0, 0.2, 1)"
          hasTransition: "true"
          utilityClasses: "hover:bg-muted"
    - variant: default
      description: compact size
      count: 5
      styles:
        color: "rgb(255, 255, 255)"
        font-size: 16px
        font-weight: 400
        padding: 0px
      states:
        hover:
          hasTransition: "true"
          transition: "all"

  dropdowns:
    - count: 20
      styles:
        background: "rgba(0, 0, 0, 0)"
        border: "0px solid rgb(229, 229, 229)"
        border-radius: 0px
        box-shadow: "none"
        min-width: auto
    - count: 6
      styles:
        background: "rgba(16, 122, 77, 0.9)"
        border: "0px solid rgb(229, 229, 229)"
        border-radius: 0px
        box-shadow: "none"
        min-width: auto

  tables:

  badges:
