name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build_desktop:
    name: Build Desktop App
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 25 (temurin) for packaging
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Download JBR 25 for runtime
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ARCH=$(uname -m)
            if [[ "$ARCH" == "arm64" ]]; then
              JBR_URL="https://cache-redirector.jetbrains.com/intellij-jbr/jbr_jcef-25-osx-aarch64-b176.4.tar.gz"
            else
              JBR_URL="https://cache-redirector.jetbrains.com/intellij-jbr/jbr_jcef-25-osx-x64-b176.4.tar.gz"
            fi
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            JBR_URL="https://cache-redirector.jetbrains.com/intellij-jbr/jbr_jcef-25-linux-x64-b176.4.tar.gz"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            JBR_URL="https://cache-redirector.jetbrains.com/intellij-jbr/jbr_jcef-25-windows-x64-b176.4.zip"
          fi

          echo "Downloading JBR from: $JBR_URL"
          curl -L "$JBR_URL" -o jbr-download.tar.gz
          mkdir -p "$HOME/jbr"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            unzip -q jbr-download.tar.gz -d "$HOME/jbr"
            echo "JBR_HOME=$HOME/jbr" >> $GITHUB_ENV
          else
            tar -xzf jbr-download.tar.gz -C "$HOME/jbr" --strip-components=1
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              echo "JBR_HOME=$HOME/jbr/Contents/Home" >> $GITHUB_ENV
            else
              echo "JBR_HOME=$HOME/jbr" >> $GITHUB_ENV
            fi
          fi

      - name: Build Desktop App
        uses: openMF/mifos-x-actionhub-build-desktop-app-kmp@v1.0.1
        with:
          desktop_package_name: 'Moribito'
        env:
          JBR_HOME: ${{ env.JBR_HOME }}