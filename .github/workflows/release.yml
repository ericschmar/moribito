name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build_desktop:
    name: Build Desktop App
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Desktop App
        uses: ./.github/actions/build-desktop-app
        with:
          desktop_package_name: 'Moribito'
          build_type: 'Release'
          java-version: '21'